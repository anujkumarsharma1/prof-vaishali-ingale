# Topic map for the Publications filter chips. Keyed by bib key in _bibliography/papers.bib.
# Topics follow the research list on /about/. Assigned from titles only; if a title is ambiguous, it is "other".
# Chip counts are computed from this map at build time. Adding a paper: add its bib key here with one topic id.
